services:
  # Database
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake SMTP server for testing (web UI on port 1080)
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"

  # Node.js API (reachable only through Nginx)
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017/test
      EMAIL_SMTP_HOST: maildev
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_SECURE: "false"
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
      maildev:
        condition: service_started

  # Reverse proxy: HTTP to HTTPS redirect, forwards traffic to the API
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

  # VM metrics (CPU, RAM, Disk)
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"

  # Docker containers metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"

  # MongoDB metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
    expose:
      - "9216"
    depends_on:
      mongo:
        condition: service_healthy

  # Metrics collector
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - cadvisor
      - mongodb-exporter
         
  # Dashboard
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    depends_on:
      - prometheus
   
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
