services:
  # Database
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake SMTP server for testing (web UI on port 1080)
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"

  # Node.js API (reachable only through Nginx)
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017/test
      EMAIL_SMTP_HOST: maildev
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_SECURE: "false"
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
      maildev:
        condition: service_started

  # Reverse proxy: HTTP to HTTPS redirect, forwards traffic to the API
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

# Persistent storage for MongoDB
volumes:
  mongo_data:
