services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017/test
      EMAIL_SMTP_HOST: maildev
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      maildev:
        condition: service_started

volumes:
  mongo_data:
